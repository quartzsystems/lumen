# lumen-zfs — the Lumen storage domain: pools, datasets, and the volumes a
# virtual machine's disks live on.
#
# A library crate, not a daemon: it compiles into lumen-controlplane the same
# way lumen-net does. It is deliberately NOT a workspace member — the Lumen
# manifests are independent by design and the Makefile drives each with its own
# --manifest-path/--target-dir pair; a path dependency needs no workspace. See
# the note at the top of lumen-networking/lumen-net/Cargo.toml.
#
# Nothing here links a storage library. libzfs has no stable ABI and binding it
# is a maintenance trap, so the real backend shells out to the supported
# command-line interface with typed argument arrays — never an interpolated
# shell string. That also keeps bindgen/libclang out of the toolchain, matching
# the reasoning behind the in-tree PAM FFI in lumen-controlplane/Cargo.toml.

[package]
name = "lumen-zfs"
version = "0.3.0"
edition = "2021"
description = "Lumen storage: pools, datasets, and virtual-machine volumes"
license = "MIT"

[dependencies]
# The system domain, for one thing only: running `zpool create` and `zpool
# destroy` outside the control plane's sandbox. Those two write
# /etc/zfs/zpool.cache, which ProtectSystem=strict makes read-only; everything
# else in this crate reaches the kernel through /dev/zfs and needs nothing.
# See lumen_sys::exec and docs/system.md.
lumen-sys = { path = "../../lumen-system/lumen-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
# "process" is what the real backend needs: argv arrays handed straight to
# execve, with no shell anywhere in the path. "fs" and "io-util" are the media
# library's: an installation image is streamed to disk a chunk at a time and is
# never held in memory.
tokio = { version = "1", features = [
    "process",
    "fs",
    "io-util",
    "sync",
    "time",
    "rt",
    "macros",
] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
