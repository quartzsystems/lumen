# io_uring, for the pool daemon and nothing else.
#
# EL10 ships kernel.io_uring_disabled=2 — io_uring refused outright, for
# every process. That is a defensible default: io_uring has been a source of
# kernel vulnerabilities, and most of the appliance has no use for it.
#
# lumen-fsd does. It serves each vdisk as a ublk block device, and the ublk
# driver's whole interface *is* io_uring: the control commands and the
# per-request fetch/commit round trips are all `IORING_OP_URING_CMD`. At 2
# the daemon cannot start an export at all, failing with
# "io_uring_setup: Operation not permitted" before any device appears.
#
# So this raises it to 1, not 0. The difference matters:
#
#   2  refused for everyone            — the daemon cannot export
#   1  privileged callers only         — the daemon can, nothing else does
#   0  allowed for every process       — needlessly wide
#
# At 1 the kernel permits io_uring to callers with CAP_SYS_ADMIN (or in the
# group named by kernel.io_uring_group, which stays unset). lumen-fsd runs
# privileged because it owns raw disks; every unprivileged process on the
# appliance — a guest agent, a web process, anything that arrives later —
# stays exactly as restricted as EL10 intended.
#
# Verified on the appliance kernel rather than assumed: at 2 an export fails
# with EPERM, at 1 it comes up.
kernel.io_uring_disabled = 1
