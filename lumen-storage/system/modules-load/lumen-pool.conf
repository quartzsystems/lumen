# The ublk driver, loaded at boot on every node that can carry storage.
#
# lumen-fsd's unit already loads it (Requires=modprobe@ublk_drv.service) —
# but that only fires once a pool exists and the daemon starts. The
# pool-create preflight runs before either: it asks each member whether
# /dev/ublk-control exists, and on a kernel where nothing has loaded the
# module the honest answer is no, refusing the very workflow whose daemon
# would have loaded it. Loading at boot breaks the circle: the control
# device is simply present, and the preflight's question means what it
# says — "can this kernel serve guest disks", not "has anything happened
# to load the module yet".
#
# The module is in-tree on the appliance kernel, and loading it creates
# /dev/ublk-control and nothing else — no devices and no io_uring use
# until a daemon asks for an export.
ublk_drv
