# lumen-drbd — Lumen's replicated volumes: DRBD 9 resources over ZFS zvols.
#
# A library crate compiled into lumen-controlplane like every other domain,
# and deliberately NOT a workspace member — see the note at the top of
# lumen-cluster/Cargo.toml.
#
# Nothing here links a DRBD library. State is read from `drbdsetup status
# --json` (the machine-readable form), and every `drbdadm` invocation is
# privileged and handed to systemd through lumen_sys::exec as a transient
# unit, exactly as pcs and zpool already are. The backing zvols are created
# and destroyed through lumen-zfs — this crate never runs a zfs command.

[package]
name = "lumen-drbd"
version = "0.1.0"
edition = "2021"
description = "Lumen replicated volumes: DRBD 9 resources over ZFS zvols"
license = "MIT"

[dependencies]
# Privileged drbdadm invocations ride systemd transient units.
lumen-sys = { path = "../../lumen-system/lumen-sys" }
# The clustering domain below this one: the membership record carries the
# volume records, the topology engine decides the replication policy, and
# the validation codes live there so the console matches on one set.
lumen-cluster = { path = "../lumen-cluster" }
# The backing zvols. Volumes are thick, under each member pool's lumen
# namespace, and only ever touched through this service.
lumen-zfs = { path = "../lumen-zfs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = [
    "process",
    "fs",
    "io-util",
    "sync",
    "time",
    "rt",
    "macros",
] }
tracing = "0.1"
# The per-volume replication shared-secret.
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Only to construct a ClusterService around its mock in tests — the service
# itself never touches networking.
lumen-net = { path = "../../lumen-networking/lumen-net" }
