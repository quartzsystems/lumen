# ISO build — custom live installer ISO, runs without --privileged (chroot
# and mknod only; no loop devices). See docs/build.md.
#
# Two entry points:
#   - workflow_dispatch: manual run from the Actions tab; the ISO is
#     uploaded as a workflow artifact (14-day retention).
#   - workflow_call: invoked by release.yml on tag push with
#     attach-to-release: true; the ISO is attached to the GitHub release.
#
# The boot-smoke job boots the freshly built ISO in QEMU/KVM (hosted
# runners expose /dev/kvm) with OVMF and waits for the installer's
# LUMEN-INSTALLER-READY marker on the serial console — an end-to-end check
# of kernel -> dracut -> squashfs -> logind -> gnome-kiosk -> GTK app.
name: ISO

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      attach-to-release:
        description: Attach the ISO to the release for the current tag
        type: boolean
        default: false

jobs:
  iso:
    name: Build ISO (AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf -y install rpm-build rpmdevtools createrepo_c xorriso mtools \
            dosfstools squashfs-tools isomd5sum kmod \
            rust cargo gtk4-devel make git-core
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/cargo-target
          key: cargo-iso-${{ hashFiles('lumen-installer/app/Cargo.toml') }}
      - name: Restore cached upstream ISO
        uses: actions/cache@v4
        with:
          path: upstream.iso
          key: upstream-iso-${{ hashFiles('iso/upstream.env') }}
      - name: Download upstream ISO (cache miss only)
        run: |
          . iso/upstream.env
          if [ ! -f upstream.iso ]; then
            curl -fL --retry 3 -o upstream.iso "$UPSTREAM_ISO_URL"
          fi
          echo "$UPSTREAM_ISO_SHA256  upstream.iso" | sha256sum -c -
      - name: Build ISO
        run: |
          . iso/upstream.env
          make iso UPSTREAM_ISO="$PWD/upstream.iso" UPSTREAM_SHA256="$UPSTREAM_ISO_SHA256"
      - name: Attach ISO to release
        if: inputs.attach-to-release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.iso
            dist/*.iso.sha256
      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-iso
          path: |
            dist/*.iso
            dist/*.iso.sha256
          if-no-files-found: error
          retention-days: 14

  boot-smoke:
    name: Boot smoke test (QEMU/OVMF)
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - uses: actions/download-artifact@v4
        with:
          name: lumen-iso
      - name: Boot ISO and wait for installer marker
        run: |
          iso="$(ls lumen-*.iso | head -n1)"
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          qemu-system-x86_64 -enable-kvm -m 4096 -smp 2 -machine q35 -cpu host \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -device virtio-vga \
            -drive file="$iso",media=cdrom,readonly=on \
            -display none -serial file:serial.log &
          qemu_pid=$!
          ok=
          for _ in $(seq 1 60); do
            if grep -q "LUMEN-INSTALLER-READY" serial.log 2>/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          kill "$qemu_pid" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "::error::installer never came up; last serial output:"
            tail -100 serial.log || true
            exit 1
          fi
          echo "Installer came up OK."
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-serial
          path: serial.log
          if-no-files-found: ignore
