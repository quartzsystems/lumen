# Release workflow: on tag push (v*), build the Lumen RPMs and the appliance
# ISO in almalinux:10 containers and attach everything to a GitHub release.
#
# The ISO build runs fully unprivileged: iso/build-iso.sh remasters with
# xorriso/xorrisofs and edits the EFI boot image with mtools, so no loop
# mounts or --privileged are needed (it deliberately does not use mkksiso,
# which fails on AlmaLinux 10 media — see docs/build.md).
#
# The upstream AlmaLinux ISO is pinned (URL + SHA-256) in iso/upstream.env
# and cached between runs; the build fails loudly on checksum mismatch.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-rpms:
    name: Build + publish RPMs (AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install epel-release   # rpmlint lives in EPEL on EL10
          dnf -y install rpm-build rpmdevtools rpmlint pykickstart make git-core
      - uses: actions/checkout@v4
      - name: Verify tag matches VERSION
        run: |
          ver="$(cat VERSION)"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $ver"
            exit 1
          fi
      - name: Build RPMs
        run: make rpms
      - name: rpmlint (specs + built RPMs)
        run: rpmlint packages/*.spec dist/rpms/*.rpm
      - name: Validate kickstart
        run: make ks-validate
      - name: Generate checksums
        run: |
          cd dist/rpms
          sha256sum ./*.rpm > SHA256SUMS
      - name: Create release with RPM artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rpms/*.rpm
            dist/rpms/SHA256SUMS

  # Shared with the manually triggerable ISO workflow (Actions tab ->
  # "ISO" -> Run workflow); on release it attaches the ISO to the release.
  release-iso:
    name: Build + publish ISO
    needs: release-rpms
    permissions:
      contents: write
    uses: ./.github/workflows/iso.yml
    with:
      attach-to-release: true
