# Release workflow: on tag push (v*), build the Lumen RPMs and the appliance
# ISO in almalinux:10 containers and attach everything to a GitHub release.
#
# The ISO is a custom live installer image (iso/build-live-iso.sh); the
# build needs no loop mounts or --privileged (see docs/build.md).
#
# The upstream AlmaLinux ISO is pinned (URL + SHA-256) in iso/upstream.env,
# with kernel/ZFS pins in iso/pins.env; the build fails loudly on checksum
# mismatch or pin drift.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-rpms:
    name: Build + publish RPMs (AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install build dependencies
        # Same set as ci.yml's rpms job: build-rpms.sh compiles
        # lumen-controlplane and the web UI export before packaging them, and
        # the control plane links both libpam and the hypervisor's client
        # library.
        run: |
          dnf -y install epel-release   # rpmlint lives in EPEL on EL10
          dnf -y install rpm-build rpmdevtools rpmlint make git-core \
            rust cargo pam-devel libvirt-devel pkgconf-pkg-config \
            nodejs npm systemd-rpm-macros checkpolicy policycoreutils
      - uses: actions/checkout@v4
      - name: Verify tag matches VERSION
        run: |
          ver="$(cat VERSION)"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $ver"
            exit 1
          fi
      - name: Build RPMs
        run: make rpms
      - name: rpmlint (specs + built RPMs)
        run: rpmlint packages/*.spec dist/rpms/*.rpm
      - name: Sign the packages
        # Signed here, at the moment they are built, rather than later when
        # they are published: this is the only step that has both the packages
        # and a reason to be trusted with the key, and a package that leaves
        # this job unsigned can never be signed retroactively without changing
        # the bytes an appliance already downloaded.
        #
        # An appliance verifies every package against the public half
        # (lumen-repo), so a release that reached the repository unsigned would
        # be a release no node can install. The gate below is what makes that
        # impossible rather than merely unlikely.
        env:
          LUMEN_GPG_PRIVATE_KEY: ${{ secrets.LUMEN_GPG_PRIVATE_KEY }}
          LUMEN_GPG_PASSPHRASE: ${{ secrets.LUMEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${LUMEN_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::LUMEN_GPG_PRIVATE_KEY is not set — refusing to publish unsigned packages"
            exit 1
          fi
          dnf -y install rpm-sign gnupg2
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$LUMEN_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$LUMEN_GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          [ -n "$key" ] || { echo "::error::no secret key was imported"; exit 1; }
          rpm --define "_gpg_name $key" \
              --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $GNUPGHOME/passphrase" \
              --addsign dist/rpms/*.rpm
          # Prove it, against the public half exactly as an appliance would.
          gpg --batch --yes --export --armor "$key" > "$RUNNER_TEMP/pub.asc"
          rpmkeys --import "$RUNNER_TEMP/pub.asc"
          for rpm in dist/rpms/*.rpm; do
            out="$(rpmkeys --checksig "$rpm")"
            case "$out" in
              *"signatures OK"*) ;;
              *) echo "::error::$rpm did not verify: $out"; exit 1 ;;
            esac
          done
          echo "Signed and verified $(ls dist/rpms/*.rpm | wc -l) packages as $key."
      - name: Generate checksums
        # After signing: the signature is part of the package file, so a
        # checksum taken before it would describe bytes nobody ever downloads.
        run: |
          cd dist/rpms
          sha256sum ./*.rpm > SHA256SUMS
      - name: Create release with RPM artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rpms/*.rpm
            dist/rpms/SHA256SUMS

  # Shared with the manually triggerable ISO workflow (Actions tab ->
  # "ISO" -> Run workflow); on release it attaches the ISO to the release.
  release-iso:
    name: Build + publish ISO
    needs: release-rpms
    permissions:
      contents: write
    uses: ./.github/workflows/iso.yml
    with:
      attach-to-release: true

  # Republish lumen.quartz.systems so installed appliances can see the release
  # that was just cut. Runs off the release assets, so it has to come after
  # they exist — and not after the ISO, which takes far longer and has nothing
  # to do with what a running node updates from.
  publish-repo:
    name: Publish the package repository
    needs: release-rpms
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit
