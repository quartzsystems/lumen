# Publish lumen.quartz.systems: the landing page, and the package repository
# every installed appliance updates from.
#
# ## Why the repository is built here rather than committed
#
# Nothing in this workflow is checked into the repository. The packages come
# from the GitHub releases that already published them, the metadata is
# generated, and the whole tree is handed to Pages as an artifact. Committing
# built RPMs would grow the git pack by tens of megabytes per release,
# permanently and unremovably, to store bytes that already exist as release
# assets.
#
# That is also why this uses the Actions deployment rather than the
# "deploy from a branch" mode: branch mode can only publish the repository root
# or /docs, and only content that has been committed. Actions mode publishes
# any directory, assembled at build time.
#
# ## What is signed, and where
#
# The packages are signed in release.yml, at the moment they are built, and
# arrive here already signed. This workflow signs one further thing: the
# repository index (repodata/repomd.xml). Both matter and they are different
# claims — a package signature says "Quartz Systems built this", and an index
# signature says "and this is the current set of them". Without the second, an
# attacker who took the hostname could serve a genuine but superseded package
# in place of a fixed one.
#
# ## Size
#
# Pages publishes at most about a gigabyte. A Lumen release is roughly 35 MB of
# packages, so REPO_RELEASES is bounded rather than unbounded: the newest few
# releases are mirrored and older ones stay on the releases page, which is
# where they came from. dnf needs the current build and, for a downgrade, the
# one before it — not every build ever made.
#
# If that ever stops being enough, the escape hatch is createrepo_c's
# --location-prefix, which writes absolute package addresses into the metadata
# so the index can live here while the packages stream from the releases page.
# It needs one createrepo_c run per release tag and a mergerepo_c pass, which
# is why it is not the starting point.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      # The published key is copied out of the tree by the job below, so a
      # rotation has to republish the site. Without this line, committing a new
      # key changes what future packages are signed with while the address a
      # hand-configured node fetches from keeps serving the old one.
      - "packages/keys/**"
      - ".github/workflows/pages.yml"
  # Called by release.yml once the release assets exist, so a new version
  # appears in the repository without anybody pressing anything.
  workflow_call:
    secrets:
      LUMEN_GPG_PRIVATE_KEY:
        required: true
      LUMEN_GPG_PASSPHRASE:
        required: true
  # A release made or edited by hand republishes too. This is not redundant
  # with the workflow_call above: a release cut through the UI — or assets
  # re-uploaded to one — never runs release.yml, and GitHub deliberately
  # does not fire this event for releases created by a workflow's own token,
  # so exactly one of the two paths runs for any given release.
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way: an interrupted
# publish would leave appliances reading an index that does not match the
# packages beside it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # How many past releases are mirrored into the published repository.
  REPO_RELEASES: "3"
  # The distribution major version the repository is laid out for. It is the
  # $releasever an appliance substitutes into the baseurl.
  RELEASEVER: "10"

jobs:
  publish:
    name: Build and deploy the site
    runs-on: ubuntu-latest
    container: almalinux:10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Install repository tooling
        # createrepo_c writes the index; gnupg2 signs it; the GitHub CLI is how
        # the release assets are fetched.
        run: |
          dnf -y install createrepo_c gnupg2 tar findutils
          dnf -y install 'dnf-command(config-manager)'
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf -y install gh

      - uses: actions/checkout@v4

      - name: Lay out the site
        run: |
          set -euo pipefail
          mkdir -p build/pages/repo/stable/"$RELEASEVER"/x86_64
          mkdir -p build/pages/repo/testing/"$RELEASEVER"/x86_64
          cp docs/site/index.html build/pages/index.html
          # The public key, served at a stable address so a node being set up
          # by hand — or a rebuild pointing at this repository — has somewhere
          # to fetch it from. It is public material; the private half never
          # leaves the secret store.
          if [ -s packages/keys/RPM-GPG-KEY-lumen ]; then
            cp packages/keys/RPM-GPG-KEY-lumen build/pages/RPM-GPG-KEY-lumen
          else
            echo "::warning::packages/keys/RPM-GPG-KEY-lumen is absent; the site will not serve a key"
          fi

      - name: Collect packages from the most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable="build/pages/repo/stable/$RELEASEVER/x86_64"
          # --repo is given explicitly rather than letting gh infer it from the
          # checkout. gh resolves the repository by shelling out to git, and git
          # refuses to read a tree it considers foreign-owned — which is exactly
          # what a checkout looks like inside this container, where the job runs
          # as root. That failure has nothing to say about releases, so inferring
          # the repository turns a container detail into an empty repository.
          #
          # Newest first. A repository with no releases yet is not an error — it
          # produces a valid, empty index, which is what a node should read
          # before the first release exists. A *failed query* is an entirely
          # different thing and must not be silently read as "none".
          if ! tags="$(gh release list --repo "$GITHUB_REPOSITORY" \
                         --limit "$REPO_RELEASES" --json tagName \
                         --jq '.[].tagName')"; then
            echo "::error::could not list releases for $GITHUB_REPOSITORY; refusing to publish a repository that would silently be empty"
            exit 1
          fi
          if [ -z "$tags" ]; then
            echo "No releases yet; publishing an empty repository."
          fi
          # How many releases actually carry packages — what the gate at the
          # end judges against, so a release still being built cannot make an
          # otherwise-correct publish look like a failure.
          with_assets=0
          for tag in $tags; do
            echo "==> $tag"
            # A release with no packages *yet* is the ordinary state of a
            # release being cut: the tag is published the moment it is
            # created, and release.yml is still compiling the RPMs that will
            # hang off it. This workflow runs on that publish, so failing
            # here would mean every release breaks the site for as long as
            # its build takes — and then fixes itself, which is the worst
            # kind of alarm. Skipped with a warning instead; release.yml
            # calls this workflow again once the assets exist.
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                        --json assets --jq '[.assets[].name | select(endswith(".rpm"))] | length')"
            if [ "${assets:-0}" -eq 0 ]; then
              echo "::warning::$tag has no packages yet — skipping it. If its build is still running, this site is republished when it finishes."
              continue
            fi
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --dir "$stable" --pattern '*.rpm' --clobber || {
              echo "::error::could not download packages from $tag"
              exit 1
            }
          done
          # Source packages are published on the releases page for anyone who
          # wants them; they have no business in a repository an appliance
          # resolves against, where they only inflate the index.
          find "$stable" -name '*.src.rpm' -delete
          ls -l "$stable" || true
          # The gate this step was missing: every failure above used to end in a
          # warning, so a run that mirrored nothing at all still went green and
          # published an empty repository over a working one.
          count="$(find "$stable" -maxdepth 1 -name '*.rpm' | wc -l)"
          echo "==> mirrored $count packages"
          # The gate this step was missing: every failure above used to end in
          # a warning, so a run that mirrored nothing at all still went green
          # and published an empty repository over a working one. It counts
          # releases that *have* packages, not releases that exist — a brand
          # new tag whose build is still running is not evidence of anything
          # being wrong, and treating it as such is what broke v0.4.0's site
          # publish before its RPMs had been built.
          if [ "$with_assets" -gt 0 ] && [ "$count" -eq 0 ]; then
            echo "::error::releases carry packages but none were mirrored from them"
            exit 1
          fi

      - name: Point the install instructions at a package that exists
        # The landing page carries the one copy-pasteable command for setting up
        # a node by hand, and it has to name a specific file. Hardcoding the
        # version there means every release silently invalidates it — the page
        # keeps advertising a package that is no longer published.
        #
        # The name is taken from the package actually mirrored above rather than
        # from VERSION. On main, VERSION is frequently a version that has been
        # bumped but not yet tagged, so templating from it would swap one wrong
        # answer for another; the mirrored file is by construction one a reader
        # can download.
        run: |
          set -euo pipefail
          stable="build/pages/repo/stable/$RELEASEVER/x86_64"
          # A missing placeholder means someone edited the page back to a
          # literal version, which fails silently and stays wrong until a user
          # reports a 404. Catch it here instead.
          if ! grep -q '@LUMEN_REPO_RPM@' build/pages/index.html; then
            echo "::error::docs/site/index.html has no @LUMEN_REPO_RPM@ placeholder; the install command would publish whatever version is hardcoded in it"
            exit 1
          fi
          rpm="$(find "$stable" -maxdepth 1 -name 'lumen-repo-*.rpm' -printf '%f\n' \
                   | sort -V | tail -n1)"
          if [ -z "$rpm" ]; then
            # Before the first release there is nothing to point at. The command
            # is published unresolvable either way; say so in the log rather
            # than failing the deployment of an otherwise correct site.
            rpm="lumen-repo-$(cat VERSION)-1.el10.noarch.rpm"
            echo "::warning::no lumen-repo package was mirrored; the manual install command will name $rpm, which is not published"
          fi
          echo "==> manual install points at $rpm"
          sed -i "s|@LUMEN_REPO_RPM@|$rpm|g" build/pages/index.html

      - name: Import the signing key
        env:
          LUMEN_GPG_PRIVATE_KEY: ${{ secrets.LUMEN_GPG_PRIVATE_KEY }}
          LUMEN_GPG_PASSPHRASE: ${{ secrets.LUMEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${LUMEN_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::LUMEN_GPG_PRIVATE_KEY is not set — the index cannot be signed"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$LUMEN_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$LUMEN_GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          [ -n "$key" ] || { echo "::error::no secret key was imported"; exit 1; }
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "LUMEN_KEY_ID=$key" >> "$GITHUB_ENV"
          echo "Signing as $key"

      - name: Build and sign the repository index
        run: |
          set -euo pipefail
          sign_tree() {
            local dir="$1"
            createrepo_c --quiet "$dir"
            # Detached, armoured, next to the file it covers: the name and the
            # location are both what dnf's repo_gpgcheck looks for.
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase-file "$GNUPGHOME/passphrase" \
                --local-user "$LUMEN_KEY_ID" \
                --detach-sign --armor "$dir/repodata/repomd.xml"
            gpg --verify "$dir/repodata/repomd.xml.asc" "$dir/repodata/repomd.xml"
          }
          sign_tree "build/pages/repo/stable/$RELEASEVER/x86_64"
          # The testing channel is published empty rather than absent: a node
          # that has it turned on must read "nothing here" rather than a 404,
          # which dnf reports as a broken repository.
          sign_tree "build/pages/repo/testing/$RELEASEVER/x86_64"

      - name: Verify a package signature actually verifies
        # The gate that would have caught an unsigned release: if the packages
        # about to be served are not signed by the key the appliance will be
        # given, every node that installs one fails — and it fails at the
        # customer, not here.
        run: |
          set -euo pipefail
          stable="build/pages/repo/stable/$RELEASEVER/x86_64"
          shopt -s nullglob
          rpms=("$stable"/*.rpm)
          if [ ${#rpms[@]} -eq 0 ]; then
            echo "No packages to verify yet."
            exit 0
          fi
          gpg --batch --yes --export --armor "$LUMEN_KEY_ID" > "$RUNNER_TEMP/pub.asc"
          rpmkeys --import "$RUNNER_TEMP/pub.asc"
          for rpm in "${rpms[@]}"; do
            out="$(rpmkeys --checksig "$rpm")"
            case "$out" in
              *"signatures OK"*) ;;
              *) echo "::error::$out"; exit 1 ;;
            esac
          done
          echo "All ${#rpms[@]} packages verify against $LUMEN_KEY_ID."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - id: deploy
        uses: actions/deploy-pages@v4
