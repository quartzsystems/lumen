name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck packages/build-rpms.sh iso/build-live-iso.sh \
                     lumen-installer/live/build-live.sh \
                     lumen-networking/nicnames/lumen-nicnames \
                     branding/console/lumen-console-banner \
                     branding/console/50-lumen-banner

  rpms:
    name: RPMs (AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install build dependencies
        # rust/pam-devel/libvirt-devel/nodejs: build-rpms.sh compiles
        # lumen-controlplane and the web UI export before packaging them, and
        # the control plane links both libpam and the hypervisor's client
        # library. checkpolicy/policycoreutils: it also compiles the control
        # plane's SELinux module.
        run: |
          dnf -y install epel-release   # rpmlint lives in EPEL on EL10
          dnf -y install rpm-build rpmdevtools rpmlint make git-core \
            rust cargo pam-devel libvirt-devel pkgconf-pkg-config \
            nodejs npm systemd-rpm-macros checkpolicy policycoreutils
      - uses: actions/checkout@v4
      - name: Build RPMs
        run: make rpms
      - name: rpmlint (specs + built RPMs)
        run: rpmlint packages/*.spec dist/rpms/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-rpms
          path: dist/rpms/

  installer:
    name: Installer (Rust, AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install Rust + GTK4 toolchain
        # gtk4-devel needs CRB on EL10; rustfmt/clippy ship with the
        # AppStream rust toolset.
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install rust cargo rustfmt clippy gtk4-devel make git-core
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/cargo-target
          key: cargo-${{ hashFiles('lumen-installer/app/Cargo.toml') }}
      - name: Format
        run: cargo fmt --manifest-path lumen-installer/app/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --manifest-path lumen-installer/app/Cargo.toml \
            --target-dir build/cargo-target -- -D warnings
      - name: Tests
        run: |
          cargo test --manifest-path lumen-installer/app/Cargo.toml \
            --target-dir build/cargo-target

  system:
    name: System (Rust, AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install Rust toolchain
        # No system libraries: lumen-sys reaches logind through pure-Rust zbus
        # and hands privileged commands to systemd-run, so there is nothing to
        # link. Its tests neither restart the runner nor touch its accounts —
        # the account database is a temporary directory and the power backend
        # records what it was asked to do.
        run: dnf -y install rust cargo rustfmt clippy make git-core
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/cargo-target-sys
          key: cargo-sys-${{ hashFiles('lumen-system/lumen-sys/Cargo.toml') }}
      - name: Format
        run: cargo fmt --manifest-path lumen-system/lumen-sys/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --manifest-path lumen-system/lumen-sys/Cargo.toml \
            --all-targets --target-dir build/cargo-target-sys -- -D warnings
      - name: Tests
        run: |
          cargo test --manifest-path lumen-system/lumen-sys/Cargo.toml \
            --target-dir build/cargo-target-sys

  networking:
    name: Networking (Rust, AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install Rust toolchain
        # No system libraries: lumen-net talks to the system bus through
        # pure-Rust zbus, so there is nothing to link and no NetworkManager
        # needed. Its tests run against the in-memory backend.
        run: dnf -y install rust cargo rustfmt clippy make git-core
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/cargo-target-net
          key: cargo-net-${{ hashFiles('lumen-networking/lumen-net/Cargo.lock') }}
      - name: Format
        run: cargo fmt --manifest-path lumen-networking/lumen-net/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --manifest-path lumen-networking/lumen-net/Cargo.toml \
            --all-targets --target-dir build/cargo-target-net -- -D warnings
      - name: Tests
        run: |
          cargo test --manifest-path lumen-networking/lumen-net/Cargo.toml \
            --target-dir build/cargo-target-net

  storage:
    name: Storage (Rust, AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install Rust toolchain
        # No system libraries and no storage software: lumen-zfs shells out to
        # the supported command line, and its tests run against the in-memory
        # backend, so there is nothing to link and no pools to touch.
        run: dnf -y install rust cargo rustfmt clippy make git-core
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/cargo-target-zfs
          key: cargo-zfs-${{ hashFiles('lumen-storage/lumen-zfs/Cargo.lock') }}
      - name: Format
        run: cargo fmt --manifest-path lumen-storage/lumen-zfs/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --manifest-path lumen-storage/lumen-zfs/Cargo.toml \
            --all-targets --target-dir build/cargo-target-zfs -- -D warnings
      - name: Tests
        run: |
          cargo test --manifest-path lumen-storage/lumen-zfs/Cargo.toml \
            --target-dir build/cargo-target-zfs

  cluster:
    name: Cluster (Rust, AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install Rust toolchain
        # No system libraries and no cluster stack: lumen-cluster reads
        # corosync and Pacemaker through their command lines, and its tests
        # run against the in-memory backend — CI never forms a cluster.
        run: dnf -y install rust cargo rustfmt clippy make git-core
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/cargo-target-cluster
          key: cargo-cluster-${{ hashFiles('lumen-storage/lumen-cluster/Cargo.lock') }}
      - name: Format
        run: cargo fmt --manifest-path lumen-storage/lumen-cluster/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --manifest-path lumen-storage/lumen-cluster/Cargo.toml \
            --all-targets --target-dir build/cargo-target-cluster -- -D warnings
      - name: Tests
        run: |
          cargo test --manifest-path lumen-storage/lumen-cluster/Cargo.toml \
            --target-dir build/cargo-target-cluster

  compute:
    name: Compute (Rust, AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install Rust toolchain + hypervisor headers
        # libvirt-devel is needed to LINK, not to run: every test uses the
        # in-memory backend and CI never touches the runner's hypervisor.
        # The bindings ship generated, so no libclang comes with it.
        run: |
          dnf -y install rust cargo rustfmt clippy libvirt-devel \
            pkgconf-pkg-config make git-core
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/cargo-target-virt
          key: cargo-virt-${{ hashFiles('lumen-compute/lumen-virt/Cargo.lock') }}
      - name: Confirm no code generator is pulled in
        # The decision recorded in docs/compute.md, enforced: if a future
        # bump makes the bindings generate at build time, this fails here
        # rather than on an appliance.
        run: |
          cargo tree --manifest-path lumen-compute/lumen-virt/Cargo.toml \
            -e normal,build | tee /tmp/tree.txt
          ! grep -qE '^\s*[|`+-]*\s*(bindgen|clang-sys) ' /tmp/tree.txt
      - name: Format
        run: cargo fmt --manifest-path lumen-compute/lumen-virt/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --manifest-path lumen-compute/lumen-virt/Cargo.toml \
            --all-targets --target-dir build/cargo-target-virt -- -D warnings
      - name: Tests
        run: |
          cargo test --manifest-path lumen-compute/lumen-virt/Cargo.toml \
            --target-dir build/cargo-target-virt

  controlplane:
    name: Control plane (Rust, AlmaLinux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - name: Install Rust toolchain + system headers
        # pam-devel: the built-in "lumen" realm links libpam directly.
        # libvirt-devel: the compute domain links the hypervisor's client
        # library. Neither pulls a code generator into the toolchain — the
        # bindings ship generated (see docs/compute.md), so no libclang.
        run: |
          dnf -y install rust cargo rustfmt clippy pam-devel libvirt-devel \
            pkgconf-pkg-config make git-core
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/cargo-target-cp
          key: cargo-cp-${{ hashFiles('lumen-controlplane/Cargo.lock') }}
      - name: Format
        run: cargo fmt --manifest-path lumen-controlplane/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --manifest-path lumen-controlplane/Cargo.toml \
            --all-targets --target-dir build/cargo-target-cp -- -D warnings
      - name: Tests
        run: |
          cargo test --manifest-path lumen-controlplane/Cargo.toml \
            --target-dir build/cargo-target-cp

  webui:
    name: Web UI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumen-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lumen-webui/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build (static export)
        run: npm run build
