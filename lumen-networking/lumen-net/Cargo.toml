# lumen-net — the Lumen networking domain: model, validation, planning, and
# the NetworkManager backend that applies plans over the system bus.
#
# A library crate, not a daemon: it compiles into lumen-controlplane (see
# docs/networking.md for why, and for the trigger that would split it out).
# It is deliberately NOT a workspace member — lumen-installer/app and
# lumen-controlplane are independent manifests and the Makefile drives them
# with separate --manifest-path/--target-dir pairs; a path dependency needs
# no workspace.
#
# zbus is pure Rust: no bindgen, no libclang, matching the in-tree PAM FFI's
# reasoning in lumen-controlplane/Cargo.toml.

[package]
name = "lumen-net"
version = "0.2.0"
edition = "2021"
description = "Lumen networking: bridges, bonds, VLANs over NetworkManager"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"
# System-bus client. default-features = false + "tokio" keeps async-io (and a
# second reactor) out of the controlplane, which is already tokio-driven.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
