# Lumen appliance policy for the network configuration daemon.
#
# Shipped by the lumen-networking package into the vendor directory
# (/usr/lib/NetworkManager/conf.d). Drop a file with a higher-sorting name
# into /etc/NetworkManager/conf.d to override any of it locally.

[main]
# Do not invent a profile for an interface that has none.
#
# By default the daemon creates a "Wired connection N" profile for any wired
# interface it finds without one and brings it up with automatic addressing.
# On Lumen that fights the configuration model: an interface nothing has
# configured is meant to have no profile, and the console reports it as
# unconfigured. An auto-created profile would show up as a configuration the
# operator never made, hold an address nobody asked for, and be recreated
# every boot after the console removed it.
#
# The management interface is unaffected: the installer writes its profiles
# explicitly (see docs/networking.md).
no-auto-default=*
