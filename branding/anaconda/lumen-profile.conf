# Anaconda profile for Quartz Systems Lumen.
#
# Applied at install time via images/product.img: iso/build-iso.sh packs
# this file (as /etc/anaconda/profile.d/lumen.conf) together with the
# stylesheet and sidebar logo into a gzipped cpio archive that Anaconda's
# dracut module overlays onto the installer runtime. The boot configs
# select the profile explicitly with inst.profile=lumen — the installer
# environment's os-release still identifies as AlmaLinux, so the
# [Profile Detection] match below only takes effect on an installed Lumen
# system (e.g. future upgrade/rescue flows).

[Profile]
profile_id = lumen

[Profile Detection]
os_id = lumen
variant_id = lumen

[Product]
product_name = Quartz Systems Lumen

[User Interface]
# Artwork and stylesheet are packed into product.img next to this file.
custom_stylesheet = /usr/share/anaconda/pixmaps/lumen.css
# Keep the hub to what an operator actually decides at install time
# (root password, destination disk, management network, time zone):
#   UserSpoke              - the appliance is root-only at install time
#   SoftwareSelectionSpoke - the package set is fixed by the kickstart
hidden_spokes =
    UserSpoke
    SoftwareSelectionSpoke
