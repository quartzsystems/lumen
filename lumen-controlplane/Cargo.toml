# lumen-controlplane — the Lumen hypervisor control plane.
#
# One daemon serves everything on :8443 (TLS): the REST API under /api and
# the static lumen-webui export everywhere else — no Node.js on the
# appliance. Built in CI on almalinux:10 with the AppStream rust/cargo
# toolchain (pam-devel provides the libpam headers the `pam` crate links).
#
# Cargo.lock is committed; release builds use --locked.

[package]
name = "lumen-controlplane"
version = "0.2.0"
edition = "2021"
description = "Lumen control plane: authentication API + web UI server"
license = "MIT"

[dependencies]
# The system domain: the node's own accounts, its power state, and the
# privileged-command runner every other domain borrows. The most basic of the
# four — it depends on none of them, and lumen-zfs depends on it.
lumen-sys = { path = "../lumen-system/lumen-sys" }
# The networking domain: model, validation, planning, and the NetworkManager
# backend. A path dependency, deliberately not a workspace member — see the
# note at the top of lumen-networking/lumen-net/Cargo.toml.
lumen-net = { path = "../lumen-networking/lumen-net" }
# The storage domain: pools, datasets, and the volumes a machine's disks live
# on. Shells out to the supported command line; nothing is linked.
lumen-zfs = { path = "../lumen-storage/lumen-zfs" }
# The clustering domain: the environment, its clusters, quorum, and fencing.
# Reads corosync and Pacemaker through their command lines; nothing is linked.
lumen-cluster = { path = "../lumen-storage/lumen-cluster" }
# The virtualization domain: the machine model, the domain document, and the
# hypervisor backend. Linking needs libvirt-devel (EL) / libvirt-dev (Debian);
# the bindings ship generated, so bindgen and libclang stay out of the
# toolchain exactly as they do for PAM below. See docs/compute.md.
lumen-virt = { path = "../lumen-compute/lumen-virt" }
# `ws` is the console viewer's transport: the browser's WebSocket carries the
# hypervisor's own console stream, byte for byte, and nothing in this crate
# interprets it. See src/api/console.rs.
axum = { version = "0.8", features = ["ws"] }
# Typed cookie jar for the httpOnly session cookie.
axum-extra = { version = "0.10", features = ["cookie"] }
# TLS listener. no-provider + rustls/ring below keeps aws-lc (and its cmake
# build dependency) out of the EL10 CI containers.
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
# Reading an upload off the socket a chunk at a time, and splitting the console
# WebSocket into its two halves. Already in the tree as a transitive dependency
# of axum; named here only to make `StreamExt`/`SinkExt` usable.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
# Session tickets: HS256 JWT in an httpOnly cookie (same model as Quartz
# Command), secret minted on first boot and persisted in the state dir.
jsonwebtoken = "9"
rand = "0.8"
# The built-in "lumen" realm authenticates local OS users through libpam via
# a minimal in-tree FFI (src/realm/pam_ffi.rs) — the published pam crates all
# run bindgen (libclang) at build time, which we keep out of the appliance
# and CI toolchains. Linking needs pam-devel (EL) / libpam0g-dev (Debian).
libc = "0.2"
# Self-signed TLS certificate minted on first boot when none is configured.
rcgen = { version = "0.13", features = ["pem"] }
# Cookie Max-Age durations (the cookie crate's time type).
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
